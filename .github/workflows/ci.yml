name: CI

on:
  push:
    branches:
      - 'master'

  pull_request:
    branches:
      - 'master'

jobs:
  androidBuild:
    defaults:
      run:
        working-directory: ./src/android

    name: Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Install Scons
        run: |
          sudo apt-get -q -y update
          sudo apt-get -q -y install scons

      - name: Assemble app debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload app APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: |
            src/android/RHVoice-core/build/outputs/apk/stable/debug/RHVoice-core-stable-debug.apk
            src/android/RHVoice-core/build/outputs/apk/alpha/debug/RHVoice-core-alpha-debug.apk
            src/android/RHVoice-core/build/outputs/apk/dev/debug/RHVoice-core-dev-debug.apk

  linuxBuild:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get -q -y update
          sudo apt-get -q -y install scons libpulse-dev libao-dev portaudio19-dev libspeechd-dev

      - name: build
        run: scons -j2

  windowsBuild:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Set up Python 3.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.7'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip lxml scons

      - name: build
        run: scons -j2

      - name: Upload packages archive
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: build/windows/packages

  macosBuild:
    name: macOS build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check generated files are current
        working-directory: ./src/macos
        run: |
          xcodegen generate
          git diff --exit-code RHVoice.xcodeproj
          python3 scripts/generate-voice-metadata.py --check
          python3 scripts/import-android-strings.py --check

      - name: Build command-line tool
        working-directory: ./src/macos
        run: xcodebuild -project RHVoice.xcodeproj -scheme RHVoiceCLI -configuration Release -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Synthesize a test sentence
        working-directory: ./src/macos
        run: |
          CLI=build/DerivedData/Build/Products/Release/rhvoice-cli
          lipo -info "$CLI"
          echo "Hello from the RHVoice continuous integration build." | RHVOICE_DATA_PATH=../../data RHVOICE_CONFIG_PATH=../../config "$CLI" -p alan -q max -o alan.wav
          afinfo alan.wav | grep -E "Data format|estimated duration"
          test "$(stat -f %z alan.wav)" -gt 100000

      - name: Build app and run tests
        working-directory: ./src/macos
        run: xcodebuild -project RHVoice.xcodeproj -scheme RHVoice -configuration Debug -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" test -quiet

